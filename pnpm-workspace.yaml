packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vitest: 4.1.10
  "@vitest/coverage-v8": 4.1.10
  vite-plus: 0.2.8
  "@stryker-mutator/core": ^9
  "@stryker-mutator/vitest-runner": ^9
  "@varlock/bumpy": ^1.18.1
  "fast-check": ^4.9.0
  sharp: ^0.35.3
  remark-gfm: ^4.0.1
  knip: ^6.32.0
  starlight-llms-txt: ^0.11.0
  react: ^19
  react-dom: ^19
  "@playwright/test": ^1.62
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  typescript: 6.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  sharp: true

packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: ^6.0.3
