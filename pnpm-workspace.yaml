packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  vite-plus: 1.4.0
  "@stryker-mutator/core": ^10
  "@stryker-mutator/vitest-runner": ^10
  "@varlock/bumpy": ^1.18.1
  "fast-check": ^4.9.0
  sharp: ^0.35.3
  remark-gfm: ^4.0.1
  knip: ^6.32.0
  starlight-llms-txt: ^0.11.0
  typescript: "6.0.3"
  "@typescript/native-preview": "7.0.0-dev.20260707.2"
  "@dagrejs/dagre": ^3.1.2
  happy-dom: ^21.0.4
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  typescript: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  sharp: true

packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: "catalog:"
