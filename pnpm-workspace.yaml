packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  "@stryker-mutator/core": ^9
  "@stryker-mutator/vitest-runner": ^9
  "@varlock/bumpy": ^1.13.1
  sharp: ^0.34.5
  lit: ^3.3.3
  "@nanostores/lit": ^0.2.3
  "@vitest/browser": 4.1.8
  playwright: ^1.60.0
  "@vitest/browser-playwright": 4.1.8
  remark-gfm: ^4.0.1
  unocss: ^66.7.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  sharp: true
