name: CI

on:
  pull_request:
    branches: [main, wip]
  push:
    branches: [wip]

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: install leaves tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: vp exec playwright install --with-deps chromium
      - run: vp run ready
      - run: node scripts/pack-smoke.mjs

  mutation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run mutation:core

  mutation-sugar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run mutation:sugar

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # same-runner, alternating base/PR runs, best-of-3: tight threshold, no cross-machine noise
      - run: vp run bench:main
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
