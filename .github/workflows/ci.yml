name: CI

on:
  pull_request:
    branches: [main, wip]
  push:
    branches: [wip]

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run mutation:core
      - run: vp run mutation:sugar
      - run: vp run ready
      - run: vp run knip

  viz-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: npx playwright install --with-deps chromium
        working-directory: packages/viz
      - run: vp run -F @mantaq/viz browser:build
      - run: vp run -F @mantaq/viz test:browser
      - name: Golden diff report
        if: failure()
        run: |
          for d in test-results/graph-*/; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            ls "$d" | head -8
            cat "$d/error-context.md" 2>/dev/null | head -25
          done
        working-directory: packages/viz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: viz-playwright-report
          path: |
            packages/viz/test-results/
            packages/viz/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
