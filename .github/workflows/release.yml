name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Per-ref: serialize a branch's releases, don't cancel in-flight ones
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp exec bumpy ci check --comment
        env:
          GH_TOKEN: ${{ github.token }}

  # Versioning is manual (run `bumpy version` locally, commit via PR).
  # `plan` detects what a push to main means: `publish` when versions were
  # bumped and are unpublished, otherwise `nothing` — so routine merges with
  # pending bump files stay green instead of failing the release job.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - id: plan
        run: vp exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # No build step here: bumpy requires a clean tree (vp pack rewrites
      # package.json exports), and the tree must stay clean for its check.
      # Each package's `prepack` (vp run build) builds + rewrites exports
      # during pnpm pack, after the check has passed.
      # Publishing uses npm trusted publishing (OIDC) — no token secrets.
      - run: vp exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
