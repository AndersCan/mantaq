name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Per-ref: serialize a branch's releases, don't cancel in-flight ones
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: bumpy check (allow version bump PRs)
        run: |
          set +e
          vp exec bumpy ci check --comment
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            exit 0
          fi
          # Version PRs from `bumpy version` bump package.json versions and
          # remove .bumpy files, so "no bump files" is expected. Detect a
          # version bump by diffing package.json against the PR base.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -n "$base" ] && [ -n "$head" ]; then
            if git diff --name-only "$base" "$head" | grep -q "package.json"; then
              echo "Version bump detected (package.json changed), ignoring bumpy check failure"
              # Re-run with --no-fail to still post the PR comment as warning
              vp exec bumpy ci check --comment --no-fail || true
              exit 0
            fi
          fi
          # Fallback: also check working tree diff for local runs
          if git diff --name-only HEAD | grep -q "package.json" || git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "package.json"; then
            echo "Version bump detected, ignoring bumpy check failure"
            vp exec bumpy ci check --comment --no-fail || true
            exit 0
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

  # Versioning is manual (run `bumpy version` locally, commit via PR).
  # `plan` detects what a push to main means: `publish` when versions were
  # bumped and are unpublished, otherwise `nothing` — so routine merges with
  # pending bump files stay green instead of failing the release job.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - id: plan
        run: vp exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # No build step here: bumpy requires a clean tree (vp pack rewrites
      # package.json exports), and the tree must stay clean for its check.
      # Each package's `prepack` (vp run build) builds + rewrites exports
      # during pnpm pack, after the check has passed.
      # Publishing uses npm trusted publishing (OIDC) — no token secrets.
      - run: vp exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
