<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer Dev</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #333;
      }

      #root {
        width: 100%;
        max-width: 1200px;
        height: 60vh;
        min-height: 400px;
      }

      #current-state {
        margin-top: 8px;
        font-family: monospace;
        font-size: 13px;
        color: #666;
      }

      #buttons {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #buttons button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        font-family: monospace;
      }

      #buttons button:hover:not(:disabled) {
        background: #e5e7eb;
      }

      #buttons button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Workflow Visualizer</h1>
    <div id="root"></div>
    <div id="current-state">State: idling</div>
    <div id="buttons"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
