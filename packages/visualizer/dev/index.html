<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer Dev</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #333;
      }

      actor-graph {
        display: block;
        width: 100%;
        max-width: 1200px;
        height: 60vh;
        min-height: 400px;
      }

      #current-state {
        margin-top: 8px;
        font-family: monospace;
        font-size: 13px;
        color: #666;
      }

      #buttons {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #buttons button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        font-family: monospace;
      }

      #buttons button:hover:not(:disabled) {
        background: #e5e7eb;
      }

      #buttons button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #buttons button.effect-btn {
        background: #e0f2fe;
        border-color: #7dd3fc;
      }

      #buttons button.effect-btn:hover:not(:disabled) {
        background: #bae6fd;
      }

      #layout-controls {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #layout-controls button {
        padding: 4px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f9f9f9;
        cursor: pointer;
        font-size: 11px;
        font-family: monospace;
      }

      #layout-controls button.active {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
      }

      #elk-controls {
        margin-top: 8px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #elk-controls button {
        padding: 3px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f9f9f9;
        cursor: pointer;
        font-size: 10px;
        font-family: monospace;
        white-space: nowrap;
      }

      #elk-controls button:hover {
        background: #e5e7eb;
      }

      #theme-toggle {
        margin-top: 12px;
        display: flex;
        justify-content: center;
      }

      #theme-toggle button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        font-family: monospace;
      }

      #theme-toggle button:hover {
        background: #e5e7eb;
      }

      [data-theme="dark"] body {
        background: #1a1a2e;
      }

      [data-theme="dark"] h1 {
        color: #e5e7eb;
      }

      [data-theme="dark"] #current-state {
        color: #9ca3af;
      }

      [data-theme="dark"] #buttons button {
        background: #1f2937;
        border-color: #4b5563;
        color: #e5e7eb;
      }

      [data-theme="dark"] #buttons button:hover:not(:disabled) {
        background: #374151;
      }

      [data-theme="dark"] #buttons button.effect-btn {
        background: #1e3a5f;
        border-color: #3b82f6;
        color: #93c5fd;
      }

      [data-theme="dark"] #buttons button.effect-btn:hover:not(:disabled) {
        background: #1e40af;
      }

      [data-theme="dark"] #layout-controls button,
      [data-theme="dark"] #elk-controls button,
      [data-theme="dark"] #theme-toggle button {
        background: #1f2937;
        border-color: #4b5563;
        color: #e5e7eb;
      }

      [data-theme="dark"] #layout-controls button:hover,
      [data-theme="dark"] #elk-controls button:hover,
      [data-theme="dark"] #theme-toggle button:hover {
        background: #374151;
      }
    </style>
  </head>
  <body>
    <h1>Workflow Visualizer</h1>
    <actor-graph id="graph"></actor-graph>
    <div id="current-state">State: idling</div>
    <div id="buttons"></div>
    <div id="layout-controls"></div>
    <div id="elk-controls"></div>
    <div id="theme-toggle"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
